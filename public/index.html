<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinity Sandstorm Search</title>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f5ece1;margin:0;padding:20px;color:#4a3b32}
.container{max-width:900px;margin:40px auto;background:#fcf8f2;padding:35px;border-radius:16px;box-shadow:0 10px 25px rgba(139,115,85,.15);border:1px solid #e3d1be}
.brand-section{text-align:center;margin-bottom:25px}.logo-img{width:140px;height:auto;margin-bottom:10px;border-radius:50%}
h1{color:#c08a3e;margin:0;font-size:2.2rem}.subtitle{font-size:.85rem;color:#8c7355;letter-spacing:1px;margin-top:5px}
.status{text-align:center;font-style:italic;color:#a08568;font-size:.9rem;margin-bottom:25px}
.privacy-badge{display:inline-block;background:#e6d5c3;color:#6e563b;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:bold;margin-bottom:15px}
.search-box{display:flex;gap:12px;margin-bottom:30px}input{flex:1;padding:14px 22px;font-size:1.05rem;border:2px solid #dcc7b1;border-radius:10px;outline:none;background:#fffcf9;color:#4a3b32}
input:focus{border-color:#c08a3e}button{padding:14px 30px;font-size:1.05rem;background:#c08a3e;color:white;border:0;border-radius:10px;cursor:pointer;font-weight:bold}
button:hover{background:#a6732e}.result-item{border-bottom:1px solid #ebdccb;padding:22px 0}
.result-title{font-size:1.15rem;color:#8c5b1b;text-decoration:none;font-weight:bold;display:block}.result-url{font-size:.82rem;color:#a6732e;direction:ltr;text-align:left;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:5px 0}
.result-meta{font-size:.85rem;color:#8c7355;margin:6px 0}.result-snippet{font-size:.95rem;color:#5c4a3c;line-height:1.6}
.no-results{text-align:center;color:#8c7355;margin-top:40px;font-size:1.05rem}
@media(max-width:600px){.container{margin:10px auto;padding:20px}.search-box{flex-direction:column}button{width:100%}}
</style>
</head>
<body>
<div class="container">
<div class="brand-section">
<img src="logo.png" alt="Infinity Sandstorm Logo" class="logo-img">
<h1>⏳ Infinity Sandstorm Search</h1>
<div class="subtitle">Sandstorm Search Engine</div>
<div class="privacy-badge">🔒 ללא מעקב</div>
</div>
<div class="status" id="status-text">טוען את מאגר החיפוש המקומי...</div>
<div class="search-box">
<input type="text" id="search-input" placeholder="חפש ב־DATA.CSV..." autofocus>
<button onclick="triggerSearch()">חפש</button>
</div>
<div id="results-container"></div>
</div>
<script>
function loadStatus(){
 fetch('/api/status').then(function(r){return r.json()}).then(function(data){
  document.getElementById('status-text').textContent=data.error?'מאגר החיפוש אינו זמין כרגע.':'מאגר החיפוש מכיל '+Number(data.total_crawled).toLocaleString()+' דפים.';
 }).catch(function(){document.getElementById('status-text').textContent='לא ניתן להתחבר למאגר החיפוש.'});
}
loadStatus();
document.getElementById('search-input').addEventListener('keypress',function(e){if(e.key==='Enter')triggerSearch()});
function escapeHtml(value){var d=document.createElement('div');d.textContent=value||'';return d.innerHTML}
function triggerSearch(){
 var query=document.getElementById('search-input').value.trim(),container=document.getElementById('results-container');
 if(!query)return;
 container.innerHTML='<div class="no-results">🔎 מחפש ב־DATA.CSV...</div>';
 fetch('/api/search?q='+encodeURIComponent(query)).then(function(r){return r.json()}).then(function(data){
  if(data.error){container.innerHTML='<div class="no-results">שגיאה בטעינת מאגר החיפוש.</div>';return}
  if(!data.results.length){container.innerHTML='<div class="no-results">🏜️ לא נמצאו תוצאות.</div>';return}
  container.innerHTML='';
  data.results.forEach(function(item){
   var div=document.createElement('div');div.className='result-item';
   var title=escapeHtml(item.title||item.url),url=escapeHtml(item.url||'');
   div.innerHTML='<a class="result-title" href="'+url+'" target="_blank" rel="noopener noreferrer">'+title+'</a>'+
   '<span class="result-url">'+url+'</span>'+
   '<div class="result-meta">📊 התאמות: <strong>'+item.score+'</strong></div>'+
   '<div class="result-snippet">'+escapeHtml(item.snippet||'')+'</div>';
   container.appendChild(div);
  });
 }).catch(function(){container.innerHTML='<div class="no-results">לא ניתן לבצע את החיפוש כרגע.</div>'});
}
</script>
</body>
</html>
