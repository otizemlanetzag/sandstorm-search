<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandstorm Settings</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><h1>Settings</h1><p>Control how Sandstorm behaves in this browser.</p></header>
<main class="settings-card">
<section class="setting-row"><div><h2>SafeSearch</h2><p>When enabled, Sandstorm filters indexed pages with strong adult-content indicators. It is enabled by default.</p></div><label class="switch"><input id="safeSearch" type="checkbox" checked><span class="slider"></span></label></section>
<p id="status" class="status">SafeSearch is enabled.</p>
<a class="settings-link" href="/">← Back to search</a>
</main>
<script src="/settings.js" defer></script></body></html>
