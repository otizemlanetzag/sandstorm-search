[build]
  publish = "public"
  command = "python -m backend.export_index"

[functions]
  directory = "netlify/functions"
  included_files = ["public/index.json"]

[[redirects]]
  from = "/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/private/blobs"
  to = "/.netlify/functions/private"
  status = 200

[build.environment]
  PYTHON_VERSION = "3.12"
